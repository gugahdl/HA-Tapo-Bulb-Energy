name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repo uses HACS "content_in_root" layout (integration files live at
      # repo root, see hacs.json). Hassfest expects a custom_components/<domain>
      # tree, so stage a copy in that shape before validating.
      - name: Arrange files into custom_components layout
        run: |
          mkdir -p custom_components/tapo_bulb_energy
          mv __init__.py config_flow.py const.py manifest.json sensor.py icon.png strings.json translations custom_components/tapo_bulb_energy/
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands/topics require actions outside this repo (a PR to
          # home-assistant/brands, and GitHub repo topics settings) and
          # are only required for the curated HACS default store, not for
          # installing via a HACS custom repository. Skip until done.
          ignore: brands,topics
